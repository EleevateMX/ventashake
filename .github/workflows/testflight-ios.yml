# Compila Rewards para iPhone y la sube a TestFlight, sin necesitar una Mac.
#
# Qué configurar UNA sola vez en GitHub
# (repo → Settings → Secrets and variables → Actions → pestaña "Secrets"):
#
#   APPSTORE_KEY_ID       -> el ID de la llave de App Store Connect (10 caracteres)
#   APPSTORE_ISSUER_ID    -> el Issuer ID de tu cuenta (un UUID)
#   APPSTORE_PRIVATE_KEY  -> el CONTENIDO del archivo AuthKey_XXXXXXXXXX.p8
#   APPLE_TEAM_ID         -> el Team ID (10 caracteres, en Membership)
#
# Los tres primeros salen de App Store Connect → Users and Access → Integrations
# → App Store Connect API → llave nueva con rol "App Manager". El .p8 se
# descarga UNA sola vez: si se pierde, se genera otra.
#
# NO hacen falta certificados ni perfiles de aprovisionamiento. `xcodebuild`
# con `-allowProvisioningUpdates` y la llave de API los crea y los descarga
# solo. Ese es justo el motivo de que esto pueda correr en la nube: no hay
# un .p12 que alguien tenga que exportar de su llavero y mantener vivo.
#
# La app nativa NO se versiona en el repo. Se regenera aquí en cada corrida
# desde capacitor.config.ts + scripts/app-nativa-preparar.sh, así que no hay
# forma de que un ajuste hecho a mano en Xcode se pierda en silencio.

name: TestFlight (iOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version visible en TestFlight (ej. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags: ['rewards-v*']   # git tag rewards-v1.0.0 && git push --tags

concurrency:
  group: testflight-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_DIR: apps/cliente-pwa
      # El numero de build tiene que subir en CADA subida, aunque la version
      # visible no cambie: App Store Connect rechaza un build repetido.
      # `github.run_number` sube solo y nunca se repite.
      BUILD_NUMERO: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # La llave publicable y la URL viajan DENTRO del paquete: si faltan,
      # la app instalada arranca sin poder hablar con Supabase. Son publicas
      # por diseno (van en el bundle del navegador de todas formas).
      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://zyjtnaystsporbuzcmqk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5anRuYXlzdHNwb3JidXpjbXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzMxNDksImV4cCI6MjA5Njg0OTE0OX0.USpCrgpCLMXcpWhA60mKmgMchrxCR3_kybIPIyas7iA' }}
        run: pnpm --filter @shake/cliente-pwa build

      - name: Generar el proyecto de iOS
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx --yes cap add ios
          npx --yes cap sync ios

      - name: Iconos y pantalla de arranque
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx --yes @capacitor/assets generate --ios \
            --iconBackgroundColor '#1A2E26' \
            --splashBackgroundColor '#1A2E26' \
            --splashBackgroundColorDark '#1A2E26'

      - name: Ajustes que Capacitor no pone solo
        run: bash scripts/app-nativa-preparar.sh ios

      # La llave va a un archivo con el nombre EXACTO que espera Xcode:
      # AuthKey_<KEY_ID>.p8. Con otro nombre, xcodebuild no la encuentra y
      # el error que da no menciona el nombre del archivo.
      - name: Llave de App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_PRIVATE_KEY" ]; then
            echo "::error::Faltan los secrets APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Archivar
        working-directory: ${{ env.APP_DIR }}/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          VERSION: ${{ github.event.inputs.version || '1.0.0' }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shakeaholic.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMERO"

      - name: Subir a TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # `destination: upload` hace que el propio exportArchive suba la
          # compilacion. Es un paso menos que exportar el .ipa y mandarlo
          # aparte, y usa la misma llave que ya se autentico al archivar.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Shakeaholic.xcarchive" \
            -exportPath "$RUNNER_TEMP/salida" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      # Si algo falla, el log de Xcode es lo unico que dice por que. Se
      # guarda siempre, tambien cuando sale bien: comparar una corrida rota
      # contra la ultima buena es la forma mas rapida de ver que cambio.
      - name: Guardar el registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-xcode-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/salida
            ${{ runner.temp }}/Shakeaholic.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Listo
        run: |
          echo "### Subida a TestFlight" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ github.event.inputs.version || '1.0.0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tarda unos minutos en aparecer: App Store Connect la deja en" >> $GITHUB_STEP_SUMMARY
          echo "\"Processing\" antes de dejarla instalar." >> $GITHUB_STEP_SUMMARY
