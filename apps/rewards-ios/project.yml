# Shakeaholic Rewards — app nativa de iOS (SwiftUI + Supabase).
#
# XcodeGen genera el .xcodeproj desde este archivo; el .xcodeproj NO se
# versiona (está en .gitignore). Así un ajuste hecho a mano en Xcode no se
# pierde en silencio: o vive aquí, o no existe.
#
#   cd apps/rewards-ios && xcodegen generate
#
# Habla con el MISMO Supabase que la PWA (rewards.shakeaholic.mx) y llama a
# las MISMAS funciones: la app no tiene reglas propias de dinero ni de
# lealtad, solo las pinta.

name: Rewards
options:
  bundleIdPrefix: mx.shakeaholic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Rewards:
    type: application
    platform: iOS
    sources:
      - path: Rewards
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Rewards/Info.plist
      properties:
        CFBundleDisplayName: Shakeaholic
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.food-and-drink
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Milo
        UIAppFonts:
          - BagelFatOne-Regular.ttf
          - DMSans-Variable.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        # La vuelta del login de Google (Supabase -> la app). Es el mismo
        # esquema que ya está dado de alta en Supabase para la app envuelta.
        CFBundleURLTypes:
          - CFBundleURLName: mx.shakeaholic.rewards
            CFBundleURLSchemes: [mx.shakeaholic.rewards]
    entitlements:
      path: Rewards/Rewards.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.shakeaholic.rewards
        PRODUCT_NAME: Shakeaholic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
