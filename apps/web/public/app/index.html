<script>
/*
 * Un solo link para la app (05/11/26): shakeaholic.mx/app.
 *
 * iPhone/iPad  -> la ficha de la App Store.
 * Android      -> la app web (PWA), donde Chrome ofrece instalarla.
 * Computadora  -> esta misma pagina, con los dos botones y un QR.
 *
 * Corre en el <head>, antes de pintar: el que va a otro lado no ve un
 * parpadeo. Si la redireccion no ocurre (navegador raro, ?ver), la pagina
 * de abajo sirve de respaldo con los dos botones.
 *
 * Android dentro de Instagram/Facebook/TikTok NO se redirige: ese navegador
 * no deja instalar una PWA. Se le ofrece abrirla en Chrome.
 *
 * iPadOS se presenta como Mac: se reconoce por la pantalla tactil.
 */
(function () {
  var IOS = 'https://apps.apple.com/mx/app/shakeaholic-rewards/id6819849860';
  var ANDROID = 'https://rewards.shakeaholic.mx/';
  var ua = navigator.userAgent || '';
  var esIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var esAndroid = !esIOS && /Android/i.test(ua);
  var enOtraApp = /FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|BytedanceWebview|Line\//i.test(ua);
  var verPagina = /[?&]ver\b/.test(location.search);
  var html = document.documentElement;
  html.setAttribute('data-so', esIOS ? 'ios' : esAndroid ? 'android' : 'otro');
  if (enOtraApp) html.setAttribute('data-en-otra-app', '');
  if (verPagina) return;
  if (esIOS) location.replace(IOS);
  else if (esAndroid && !enOtraApp) location.replace(ANDROID);
})();
</script>

<style>
/* La marca no tiene version oscura. Valores de packages/brand/tokens.css. */
:root {
  --verde: #2C4A3E;
  --verde-hondo: #1A2E26;
  --tinta: #14241D;
  --crema: #E8E6CC;
  --papel: #F6F5EA;
  --linea: #CFCDB2;
  --suave: #4D5F57;
  --menta: #88C0A0;
  --platano: #F0C649;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --cuerpo: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh; background: var(--verde-hondo); color: var(--crema);
  font-family: var(--cuerpo); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 400px; display: grid; gap: 28px; text-align: center; }
.milo { width: 132px; height: auto; margin: 0 auto; display: block; }
h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; margin: 0; }
.lema { margin: 8px auto 0; max-width: 300px; color: rgba(232, 230, 204, .75); }
.botones { display: grid; gap: 12px; }
.boton {
  display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 14px 18px; border-radius: 18px; text-decoration: none;
  background: transparent; color: var(--crema); border: 1.5px solid rgba(232, 230, 204, .3);
}
.boton svg { width: 28px; height: 28px; flex-shrink: 0; }
.boton b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
.boton small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
/* El boton del sistema que se detecto va lleno; el otro, delineado. */
html[data-so="ios"] .boton.ios,
html[data-so="android"] .boton.android,
html[data-so="otro"] .boton { background: var(--crema); color: var(--tinta); border-color: var(--crema); }
html[data-so="android"] .botones .android { order: -1; }
/* Dentro de Instagram/Facebook el lleno es «Abrir en Chrome»: el resto, delineado. */
html[data-so="android"][data-en-otra-app] .botones .boton { background: transparent; color: var(--crema); border-color: rgba(232, 230, 204, .3); }
.chrome { display: none; }
html[data-so="android"][data-en-otra-app] .chrome { display: grid; gap: 8px; }
.chrome p { margin: 0; font-size: 14px; color: rgba(232, 230, 204, .75); }
.qr { display: none; }
html[data-so="otro"] .qr { display: grid; gap: 10px; justify-items: center; }
.qr .marco { background: #fff; padding: 14px; border-radius: 18px; width: 172px; height: 172px; }
.qr p { margin: 0; font-size: 14px; color: rgba(232, 230, 204, .75); }
.pie { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(232, 230, 204, .45); }
.pie a { color: inherit; }
</style>
