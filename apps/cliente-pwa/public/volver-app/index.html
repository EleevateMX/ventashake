<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Volviendo a la app</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 16px; font-family: system-ui, -apple-system, sans-serif; background: #1A2E26; color: #E8E6CC; text-align: center; padding: 24px; }
  a { color: #1A2E26; background: #F0C649; padding: 14px 22px; border-radius: 14px; font-weight: 700; text-decoration: none; }
  p { margin: 0; opacity: .8; }
</style>
</head>
<body>
<!--
  Puente del login de Google de la app de iPhone (17/11/26).

  Supabase solo devuelve el login a direcciones de su lista; la del esquema
  de la app (mx.shakeaholic.rewards://auth) no estaba y el login caía en la
  web. Esta página está en el mismo dominio que la web (permitido siempre):
  recibe ?code=… y lo pasa tal cual al esquema de la app, que la ventana de
  login de iOS intercepta y cierra sola.
-->
<p>Volviendo a Shakeaholic…</p>
<a id="volver" href="mx.shakeaholic.rewards://auth">Abrir la app</a>
<script>
  var destino = 'mx.shakeaholic.rewards://auth' + location.search + location.hash;
  document.getElementById('volver').href = destino;
  location.replace(destino);
</script>
</body>
</html>
